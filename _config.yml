# About Section
about_title: 자기소개
# about_profile_image: images/profile.jpg
about_content: |
  #### 지원 동기
  Spring Boot, MyBatis, Vue.js, TypeScript를 활용한 웹 기반 MES와 DX를 2년 동안 개발·운영한 개발자입니다. GitLab을 통해 협업을 하고 한 기능의 백엔드부터 프론트엔드까지 개발한 경험이 있습니다. 현장의 문제를 직접 경험하고 해결해 온 경험을 바탕으로 사용자에게 필요한 기능을 만들고 서비스를 개선하는 일을 하고 싶어 지원하게 되었습니다.

  #### 소통을 잘하는 개발자
  공장의 DX를 진행하며 현장의 담당자와 팀원들과 함께 일하며 소통을 가장 중요한 가치로 생각하게 된 개발자입니다. MySQL Query 튜닝과 캐시를 이용하여 조회 속도를 개선했으며, 빠르게 성장하는 공장의 시스템에 맞추어 기능을 개발하는 경험을 쌓았습니다. 팀 내에서는 주어진 일정에 맞추어 끝까지 책임을 지고 마무리하였고, 공장의 관계자들, 팀 내의 동료들과 원활한 커뮤니케이션을 하여 팀원들에게 신뢰를 얻었습니다.

  **Blog Link**: [MySQL 인덱스 실험하고 검증하기](https://pwy8617.tistory.com/56)

