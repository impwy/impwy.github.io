about_content: |
  Java와 Spring Boot 기반으로 제조 MES를 약 2년 4개월 개발·운영한 백엔드 개발자입니다. COA·분석 데이터 파일 처리, DB 기반 라벨 발행·검증, SAP-MES 연동과 MySQL 조회 성능 개선을 설계부터 운영까지 수행했습니다.

  운영 환경의 제약에 맞춰 연동·배치 방식을 선택하고, 반복 업무와 조회 병목을 실제 운영 결과로 개선해 왔습니다.

