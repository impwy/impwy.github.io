  - title: 경력
    layout: list
    content:
      - layout: top
        title: ㈜아큐라시스템
        sub_title: 서비스지원팀 / 백엔드 개발자
        caption: 2023.05 - 2025.09
        description: |
          ### 고객사: 다이킨 첨단 머터리얼 코리아 (DAMK)
          **MES 개발·운영 | 2023.07 - 2025.09**

          **기술 스택**: Java, Spring Boot, MySQL, Linux, Vue 3

          <hr class="experience-divider">

          #### 데이터 정합성 및 안정성을 고려한 파일 배치 처리 시스템 구축
          **COA·분석 데이터 파일 자동 적재 및 장애 복구** | 2024.01 - 2024.09
          <p class="project-background"><strong>배경</strong> 분석기 생성 파일을 실무자가 주기적으로 MES에 수동 입력하고 있어 자동 적재 구조가 필요했습니다.</p>

          - 분석기 제조사와 연동 방식을 협의하고, API 전송이 불가능한 제약에 맞춰 Windows 공유 폴더 폴링 방식으로 설계
          - 파일 유형별 서식과 검증·저장 규칙을 분리해 COA와 분석 데이터에 동일한 처리 파이프라인을 재사용
          - DB 유니크 제약으로 중복을 방지하고, 파일 단위 트랜잭션으로 오류 발생 시 부분 반영을 방지
          - 배치 저장으로 저장 성능을 개선하고, 성공·실패 파일을 별도 디렉터리로 분류
          - 처리 실패 시 최대 3회 재시도한 뒤 실패 처리하고, 실패 파일과 오류 원인을 로그로 남김
          - 실패 파일을 재처리 디렉터리로 이동해 작업자가 확인하고 재처리할 수 있도록 구성
          - 운영 기간 중 중복 데이터 적재 없이 안정적으로 수집하고, 장애 시 DB 직접 수정 없이 복구 가능하도록 구현

          ---

          #### DB 기반 라벨 자동 발행·검증 시스템 구축
          **작업장·용기·발주사별 프린터 매핑과 발행 이력 관리** | 2025.01 - 2025.04
          <p class="project-background"><strong>배경</strong> 가스 용기 라벨을 작업자가 수기로 입력·발행해 오류 위험과 반복 업무가 있었으며, 발행 결과와 라벨 데이터의 일치 여부를 실무자가 확인할 수 있는 구조가 필요했습니다.</p>

          - 작업장·프린터·용기·발주사별 발행 정보를 DB로 관리하고, 실무자가 선택한 조건에 맞는 프린터와 라벨 데이터를 조회하도록 구현
          - 전략 패턴을 적용해 작업장별 프린터 선택 로직과 공통 라벨 발행 흐름을 분리
          - MES 데이터를 기반으로 ZPL 라벨을 생성하고 지정된 프린터로 자동 발행
          - 발행 결과를 성공·실패 이력으로 저장하고 실무자가 조회할 수 있는 화면 구현
          - 발행된 라벨의 바코드를 스캔하면 MES 데이터와 일치하는지 확인할 수 있는 검증 기능 구현
          - 일 약 100건의 수기 입력을 제거해 작업 속도를 2~3배 높이고, 운영 기간 동안 라벨 입력 오류 0건 유지

          ---

          #### MES-SAP 데이터 연동 | 2024.02 - 2024.09
          <p class="project-background"><strong>배경</strong> 다이킨 본사의 SAP 연동 요청에 따라 공장 가동 일정에 맞춘 MES-SAP 데이터 연계가 필요했습니다.</p>

          - 3인 팀에서 연동 구조의 설계, 기능 개발, 테스트와 운영 중 개선을 담당
          - 공정 실적은 MES에서 SAP API로 전송하고, SAP 데이터는 MES DB에 반영하는 양방향 연동 구현
          - 재고·공정·분석 데이터를 공장 운영 주기에 맞춰 일 4회 동기화

          ---

          #### MES 유지보수 및 성능 개선 | 2023.07 - 2025.09
          <p class="project-background"><strong>배경</strong> 누적 약 3만 건의 생산실적 목록을 조회할 때 4~5초의 지연이 발생했습니다.</p>

          - 복합 인덱스와 조회 쿼리, 서비스 로직을 변경해 동일 조건 조회 시간을 4~5초에서 1초로 단축
          - 신생 공장의 요구사항 변경을 반영하며 MES 기능을 지속적으로 개발·운영

          ---

          #### 글로벌 서비스 다국어 리소스 적용 | SK에너지 · 2023.05 - 2023.07
          - UI 한글 텍스트를 영문 리소스로 관리하고 Nexacro·DB 기반 코드 체계에 적용

  - title: 교육 프로젝트
    layout: text
    content: |
      #### LOOPERS E-commerce Backend
      교육 프로젝트 | 2025.07 - 2025.09<br>
      [github.com/impwy/loopers-ecommerce](https://github.com/impwy/loopers-ecommerce)

      - 상품·브랜드 조회, 좋아요, 주문·결제, 재고·쿠폰 처리를 포함한 전자상거래 도메인 로직과 테스트 구현
      - 재고 1,000개에 10개씩 차감하는 100개 동시 요청과 쿠폰 중복 사용 시나리오를 구성해 최종 데이터 정합성 검증
      - 상품 이벤트를 Outbox에 저장한 뒤 Kafka로 전달하는 비동기 처리와 통합 테스트 구현
      - Commerce API, Streamer, PG Simulator를 멀티 모듈로 분리하고 Docker 기반 MySQL·Redis·Kafka와 Prometheus·Grafana 환경 구성

      #### 웹 개발자 양성 과정
      2022.11 - 2023.04<br>
      [github.com/impwy/Land](https://github.com/impwy/Land)

      - Java, Oracle, MyBatis, JavaScript 기반 놀이공원 시스템 구현

