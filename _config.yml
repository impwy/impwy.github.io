about_content: |
  Java와 Spring Boot 기반으로 제조 MES를 개발·운영해 온 백엔드 개발자입니다. SAP-MES 연동과 COA·라벨 발행, 분석 데이터 수집을 자동화했습니다.

  MySQL 인덱스 재설계와 SQL 튜닝으로 대용량 목록 조회 시간을 4~5초에서 1초 이내로 단축했습니다.

