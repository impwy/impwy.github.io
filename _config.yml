        description: |
          ## 다이킨 첨단 머터리얼 코리아 (DAMK)
          **2023.07 - 2025.09**

          **기술 스택**: Java, Spring Boot, MySQL, Linux, Vue 3

          **MES-SAP 글로벌 시스템 실시간 연동** (2024.02 - 2024.09)
          - 다이킨 일본 본사 SAP와 공장 MES 간 재고, 공정, 출하 데이터를 실시간으로 연동
          - API 기반 데이터 동기화 체계를 구축하고 Linux crontab 배치 처리로 운영 안정성 확보
          - COA(분석증명서) 자동 발행 시스템을 구축해 수작업 프로세스를 제거하고 데이터 무결성 강화

          **라벨 발행 자동화 시스템 구축** (2025.01 - 2025.04)
          - ZPL 언어로 라벨 템플릿을 설계하고 MES 실시간 데이터와 연동
          - 개별 수동 입력 방식을 일괄 자동 발행 방식으로 전환해 휴먼 에러 감소 및 발행 효율 향상

          **폐쇄망 환경 분석 데이터 자동 수집 프로세스 개발** (2024.01 - 2024.04)
          - Windows 공용 폴더와 Linux 서버 간 연동 인터페이스를 설계하고 배치 프로세스를 구현
          - 수작업 입력 공정을 제거하고 데이터 수집의 실시간성과 정확도 확보

          **MES 시스템 유지보수 및 성능 개선** (2023.07 - 2025.09)
          - 인덱스 재설계, SQL 튜닝, Java 코드 리팩토링을 통해 대용량 목록 조회 속도를 4~5초에서 1초 이내로 개선
          - 신생 공장의 잦은 요구사항 변경에 대응하며 시스템 안정화

          ---

