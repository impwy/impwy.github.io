          웹 기반 MES와 공장 DX 개발·운영

  - title: 프로젝트
    layout: list
    content:
      - layout: top
        title: 다이킨첨단머터리얼코리아 DX 및 운영
        sub_title: 아큐라 시스템
        caption: 2023.07 - 2025.08
        description: |
          **기술 스택**: Spring Boot, MySQL 8.0, Java 11, MyBatis, Vue.js, TypeScript<br>
          **참여 인원**: 3인<br>
          **서비스**: 공장 DX를 위한 MES 개발 및 운영

          - 용기 목록 조회 시 느린 응답 문제를 DB Index 튜닝과 로직 개선으로 3초 → 800ms로 개선
          - 일평균 약 100건의 라벨 수기 입력을 MES와 프린터의 연동으로 자동화하여 작업 속도 증대
          - 수기로 입력하던 시료 분석 데이터를 배치 처리, 중복 방지, 실패 재처리를 통해 자동화하여 입력 실수와 작업 불편 개선
          - AWS 테스트 환경과 온프레미스 운영 환경의 배포 문제를 환경 설정 분리로 개선하여 서비스 배포 안정화
          - 수기로 진행하던 COA 성적서 작성 및 발행을 자동화하는 기능 구현
          - SAP와 재고 및 공정을 연동하기 위해 모든 공통코드를 SAP에 맞추고 API와 DB를 이용하여 공정 데이터 연동
          - 기능 명세와 기획 내용을 문서화하고 커뮤니케이션하여 협업에 기여
          - 한 서비스 클래스에 모든 공정이 들어가 있던 구조를 공정별 인터페이스로 나누어 코드 개선 및 가독성 증대
          - map으로 단건을 반복 조회하던 로직을 개선하고 일괄 조회로 전환하여 조회 속도 개선
          - 테스트 서버 배포 후 테스트를 진행하던 과정에서 운영 중 오류가 발생하여, 테스트 코드를 작성하고 서비스 안정화에 기여

  - title: 교육
    layout: text
    content: |
      #### LOOPERS E-commerce Backend
      **기간**: 2025.07 - 2025.09<br>
      **기술 스택**: Spring Boot, MySQL, JPA, Redis, Kafka, ArchUnit

      - 전자상거래 도메인과 개발 학습
      - DDD와 C4, diagram을 이용하여 아키텍처 설계
      - 테스트 코드를 작성하여 유지보수 안정화
      - 비관적 락과 낙관적 락에 대하여 학습
      - Redis의 캐시를 이용하여 속도 개선
      - Kafka를 이용하여 비동기 이벤트 처리로 트랜잭션 분리
      - Resilience4j를 사용하여 장애 격리 및 복구 관리
      - Redis를 이용하여 랭킹 시스템 학습
      - Prometheus, Grafana를 이용하여 서비스 모니터링 구축

      #### 웹 개발자 양성 과정 · 놀이공원 시스템
      **기간**: 2022.11 - 2023.04<br>
      **기술 스택**: Java, Spring Framework, JSP, MyBatis, Oracle, JavaScript, jQuery, CSS, HTML

      - 5인으로 구성된 팀의 조장을 맡아 팀 프로젝트 진행
      - 놀이공원 홈페이지를 제작하고 상품 구성 및 장바구니, 카카오 결제 구현

