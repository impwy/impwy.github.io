# About Section
about_title: About Me
# about_profile_image: images/profile.jpg
about_content: |
  제조 실행 시스템(MES)과 SAP 연동을 중심으로 제조 현장의 디지털 전환을 지원해 온 백엔드 개발자입니다. 대용량 데이터 조회 성능 개선, 공정 자동화, 폐쇄망 환경 데이터 수집 프로세스 설계 등 운영 현장에 직접적인 영향을 주는 문제를 해결해 왔습니다.

  특히 SQL 최적화와 인덱스 튜닝을 통해 대용량 목록 조회 속도를 4~5초에서 1초 이내로 단축했으며, MES-SAP 연동, COA 자동 발행, 라벨 발행 자동화, 분석 데이터 자동 수집 체계 구축을 통해 수작업 공정을 제거하고 데이터 무결성과 업무 연속성을 높였습니다.

  단순히 기능 구현에 그치지 않고, 확장성과 유지보수성까지 고려한 개발을 지향합니다. 프로젝트 과정에서 얻은 트러블슈팅 경험과 기술적 인사이트를 GitHub와 블로그에 꾸준히 기록하며, 팀 내 기술 자산을 축적하는 방식으로 일합니다.

