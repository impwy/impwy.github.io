  - title: Experience
    layout: list
    content:
      - layout: top
        title: ㈜아큐라시스템
        sub_title: 서비스지원팀 / 백엔드 개발자
        caption: 2023.05 - 2025.09
        description: |
          ### 고객사: 다이킨 첨단 머터리얼 코리아 (DAMK)
          **MES 개발·운영 | 2023.07 - 2025.09**

          **기술 스택**: Java, Spring Boot, MySQL, Linux, Vue 3

          #### MES-SAP 데이터 연동 | 2024.02 - 2024.09
          <p class="project-background"><strong>배경</strong> 다이킨 본사의 SAP 연동 요청에 따라 공장 가동 일정에 맞춘 MES-SAP 데이터 연계가 필요했습니다.</p>

          - 연동 구조의 설계부터 개발·운영까지 전 과정에 참여
          - 공정 실적은 공장 가동 시간에 맞춰 MES → SAP API로 전송하고, SAP 데이터는 MES DB에 반영하는 양방향 구조 구현
          - 재고·공정·분석 데이터는 공장 운영 주기에 맞춰 일 4회 동기화
          - 운영 메모리 점유를 최소화하기 위해 Spring 스케줄러 대신 Linux crontab 사용
          - COA(분석증명서) 자동 발행 기능을 구현해 수작업 발행 절차 제거

          ---

          #### 라벨 발행 자동화 | 2025.01 - 2025.04
          <p class="project-background"><strong>배경</strong> 가스 용기 라벨을 작업자가 수기로 입력·부착해 입력 오류 위험이 있었고, 작업 시간과 인력이 많이 필요했습니다.</p>

          - 전략 패턴을 적용하여 작업장별 프린터 위치를 분리해 라벨 발행 로직 구현
          - 작업 위치와 프린터에 따라 알맞은 ZPL 라벨이 자동 발행되도록 MES 데이터와 연동
          - 기존 대비 작업 속도를 2~3배 높였으며, 도입 후 운영 기간 동안 라벨 입력 오류 0건 유지

          ---

          #### 분석실의 분석 데이터 자동 수집 | 2024.01 - 2024.04
          <p class="project-background"><strong>배경</strong> 분석실 작업자가 가스 분석 결과를 엑셀과 MES에 하루 수십 건씩 수기로 입력하고 있었습니다.</p>

          - 분석기 제조사와 자동 연동 방식을 협의하고, API 전송이 불가능한 제약을 고려해 공유 폴더 폴링 방식으로 설계
          - Windows 공유 폴더의 엑셀 서식을 표준화하고 파일을 읽어 분석 데이터를 검증한 뒤 MES에 자동 등록
          - 하루 약 4회 수행하는 저빈도 작업에는 별도 Spring 스케줄러 프로세스 대신 Linux crontab 적용
          - 하루 수십 건의 반복 입력을 자동화해 입력 오류 가능성을 낮추고 작업 속도 개선

          ---

          #### MES 유지보수 및 성능 개선 | 2023.07 - 2025.09
          <p class="project-background"><strong>배경</strong> 대용량 목록 조회 시간이 4~5초까지 증가해 사용자 대기 시간을 줄이기 위한 성능 개선이 필요했습니다.</p>

          - MySQL 인덱스 재설계, SQL 튜닝, Java 코드 리팩터링으로 목록 조회 시간을 1초 이내로 단축
          - 신생 공장의 요구사항 변경을 반영하며 MES를 지속적으로 개발·운영

          ---

          ### 고객사: SK에너지
          #### 글로벌 서비스 다국어 리소스 적용 | 2023.05 - 2023.07
          <p class="project-background"><strong>배경</strong> 글로벌 서비스 제공을 위해 기존 한글 UI와 코드 체계의 영문화가 필요했습니다.</p>

          - UI의 한글 텍스트를 영문 번역 리소스로 관리하고 Nexacro·DB 기반 코드 체계에 적용

